<div class="admin__field" visible="visible" disable="disabled" css="element.setClasses(element)">
    <label if="element.label" class="admin__field-label" attr="for: element.uid">
        <span text="element.label"></span>
    </label>

    <div class="admin__field-control" data-role="grid-wrapper" attr="'data-index': index">
        <div class="admin__control-table-wrapper">
            <div data-role="spinner"
                 class="admin__data-grid-loading-mask"
                 if="$data.showSpinner">
                <div class="spinner">
                    <span repeat="8"></span>
                </div>
            </div>

            <ifnot args="hasData()">
                <div class="data-row">
                    <div class="emails-no-data" translate="'No Emails yet'"></div>
                    <div class="events-read-manual" html="getReadmeText()"></div>
                </div>
            </ifnot>

            <if args="hasData()">
            <table class="admin__dynamic-rows admin__control-table" data-role="grid" attr="{'data-index': index}">
                <thead if="element.columnsHeader">
                <tr>
                    <th if="dndConfig.enabled"></th>
                    <th repeat="foreach: labels, item: '$label'"
                        text="$label().label"
                        css="setClasses($label())"
                        visible="$label().visible"
                        disable="$label().disabled"
                        attr="{'data-name': name}">
                    </th>
                </tr>
                </thead>

                <tbody>
                    <tr class="data-row" repeat="foreach: elems, item: '$record'">
                        <td if="dndConfig.enabled"
                            css="setClasses({additionalClasses:'col-draggable'}, $record())"
                            template="name: dndConfig.template, data: getDnd()"></td>

                        <!-- ko foreach: { data: $record().elems(), as: 'elem'}  -->
                        <td if="elem.template"
                            css="$parent.setClasses(elem, $record())"
                            visible="elem.visible"
                            disable="elem.disabled"
                            template="elem.template"></td>
                        <!-- /ko -->
                    </tr>
                </tbody>

                <tfoot>
                <tr>
                <tr>
                    <td colspan="3" css="setClassesForFooter()"></td>
                    <td css="setClassesForFooter()"><text args="getTotals('sent')"></text></td>
                    <td css="setClassesForFooter()"><text args="getTotals('opened')"></text></td>
                    <td css="setClassesForFooter()"><text args="getTotals('clicks')"></text></td>
                    <td css="setClassesForFooter()"><text args="formatPercent(getTotals('open_rate'))"></text></td>
                    <td css="setClassesForFooter()"><text args="formatPercent(getTotals('click_rate'))"></text></td>
                    <td colspan="2"><a href="#" click="resetStatistics.bind($data)"><text args="$t('Reset Statistics')"></text></a></td>
                </tr>
                    <td colspan="9" class="footer-pagination">
                        <button if="element.addButton"
                                attr="{disabled: disabled, 'data-action': 'add_new_row'}"
                                type="button"
                                click="processingAddChild.bind($data, false, false, false)">
                            <span text="addButtonLabel"></span>
                        </button>

                        <div class="admin__control-table-pagination" visible="!!$data.recordData().length && (pages() > 1)">
                            <div class="admin__data-grid-pager">
                                <button class="action-previous" type="button" data-bind="attr: {title: $t('Previous Page')}, click: previousPage, disable: isFirst()"></button>
                                <input class="admin__control-text" type="number" data-bind="attr: {id: ++ko.uid}, value: currentPage">
                                <label class="admin__control-support-text" data-bind="attr: {for: ko.uid}, text: 'of ' + pages()"></label>
                                <button class="action-next" type="button" data-bind="attr: {title: $t('Next Page')}, click: nextPage, disable: isLast()"></button>
                            </div>
                        </div>
                    </td>
                </tr>
                </tfoot>
            </table>
            </if>
        </div>
    </div>
</div>
